scan-type: source
disabled: false
ignore:
  # scan-type: source scans an SBOM of the repository tree (syft dir:.), so packages bundled in the Docker base
  # image never appear in it. Keep base-image exceptions out of this file; each rule here must name the application
  # package it covers, so it cannot hide the same advisory in another package.
  - vulnerability: GHSA-g3hv-75wg-m249
    include-aliases: true
    package:
      name: minimatch
      version: 3.1.5
      type: npm
    reason: >-
      Application tree: minimatch 3.x copies pinned by eslint 9 (@eslint/config-array, @eslint/eslintrc),
      eslint-plugin-import, eslint-plugin-node, glob 7 (glob-promise) and the @redocly/openapi-core 1.0.0-beta line used
      by @redocly/openapi-cli. Fixed only in minimatch 11, whose named-export API these consumers cannot take.
      Dev/lint/release tooling only, not reachable at runtime. Mirrors the audit-ci.jsonc allowlist entry (expiry
      2026-12-31) (moderate severity)
  - vulnerability: GHSA-g3hv-75wg-m249
    include-aliases: true
    package:
      name: minimatch
      version: 5.1.9
      type: npm
    reason: >-
      Application tree: minimatch 5.x copies pinned by @redocly/openapi-core 1.34 (via @mojaloop/api-snippets) and
      filelist (jake, via shins). Fixed only in minimatch 11, whose named-export API these consumers cannot take.
      Dev/lint/release tooling only, not reachable at runtime. Mirrors the audit-ci.jsonc allowlist entry (expiry
      2026-12-31) (moderate severity)
output:
  - table
  - json
search:
  scope: squashed
quiet: false
check-for-app-update: false
